name: daily-market-update

# 매시간 :05 — 숫자만 갱신(Yahoo·네이버, 무료)
# 매일 22:00 UTC(07:00 KST) — 숫자 + Claude 서술 콘텐츠 (구독 사용량)
on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 07:00 KST — 숫자 + 서술
    - cron: "5 * * * *"    # 매시간 :05 — 숫자만
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # 서술(Claude) 단계는 일일 크론 또는 수동 실행일 때만
      RUN_NARRATIVE: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 * * *' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1) 수치 데이터 (Yahoo Finance·네이버, 무키·무료) — 매시간
      - name: 시장데이터 갱신
        run: node scripts/update-market-data.mjs

      # 1b) 하우스 뷰 (네이버 증권 리서치, 무료) — 매시간
      - name: 하우스 뷰 갱신
        run: node scripts/fetch-research.mjs
        continue-on-error: true

      - name: 데이터 갱신본 백업
        run: cp index.html /tmp/index.data.html

      # 2) 서술 콘텐츠 — 일일 크론/수동 + 토큰 있을 때만
      - name: 서술 콘텐츠 갱신 (Claude)
        if: env.CLAUDE_CODE_OAUTH_TOKEN != '' && env.RUN_NARRATIVE == 'true'
        continue-on-error: true
        run: |
          echo "BASE_BYTES=$(wc -c < index.html)" >> "$GITHUB_ENV"
          npm install -g @anthropic-ai/claude-code@latest
          timeout 900 claude -p "$(cat scripts/daily-narrative-prompt.md)" \
            --dangerously-skip-permissions \
            --output-format text

      # 3) 무결성 검사 — 서술 단계가 돌았을 때만
      - name: 무결성 검사
        if: env.CLAUDE_CODE_OAUTH_TOKEN != '' && env.RUN_NARRATIVE == 'true'
        run: |
          if ! node scripts/validate-html.mjs "${BASE_BYTES:-0}"; then
            echo "::warning::서술 갱신본 검사 실패 — 수치 갱신분만 유지"
            cp /tmp/index.data.html index.html
          fi

      # 4) 커밋 & 푸시 → Pages 자동 재배포
      - name: 변경분 커밋 & 푸시
        run: |
          git config user.name  "hanwha-emong-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add index.html data/news.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 시장데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            git push
          fi
