name: daily-market-update

# 매일 08:05 KST(전일 미국장 마감 반영) + 수동 실행
on:
  schedule:
    - cron: "5 23 * * *"   # 23:05 UTC = 08:05 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 시장데이터 갱신 (Yahoo Finance)
        run: node scripts/update-market-data.mjs

      - name: 변경분 커밋 & 푸시
        run: |
          git config user.name  "hanwha-emong-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 시장데이터 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
